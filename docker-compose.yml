  worker-notifications:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: ${COMPOSE_PROJECT_NAME:-ai-email-assistant}-worker-notifications
    restart: unless-stopped
    command: celery -A app.core.celery_app worker -Q notifications -c 2 --loglevel=info -n notifications@%h
    env_file:
      - ./backend/.env
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: ${COMPOSE_PROJECT_NAME:-ai-email-assistant}-celery-beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - ./backend/.env
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: ${COMPOSE_PROJECT_NAME:-ai-email-assistant}-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    networks:
      - app_network
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-ai-email-assistant}-nginx
    restart: unless-stopped
    volumes:
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    networks:
      - app_network
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app_network:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-ai-email-assistant}_network

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-ai-email-assistant}_postgres_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-ai-email-assistant}_redis_data